# Compatibility
set -g default-terminal "xterm-256color"
set -as terminal-overrides ",xterm-256color:RGB"
set-option -as terminal-features ',alacritty:RGB' # Neovim
set -s escape-time 0
set -g focus-events on

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Plugin Settings
run-shell ~/.tmux/plugins/tmux-thumbs/tmux-thumbs.tmux
set -g @thumbs-position off_left
# set -g @thumbs-regexp-1 '(\S+)+' # delimit based on spaces

# Preferences
set -g prefix C-a
#set -g prefix2 C-b
set -g mouse on
set -g history-limit 10000

## Colors
set -g status-bg colour62
set -g status-fg white
set -g pane-active-border-style bg=default,fg=magenta
set -g pane-border-style fg=colour62

# Keybindings
set-window-option -g mode-keys vi
# set default directory for new windows in this session to current directory:
bind M-c attach-session -c "#{pane_current_path}"
# open a new window in the current directory
bind C-c new-window -c "#{pane_current_path}"
# vim pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Pane splits should open to the same path as the current pane
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'
